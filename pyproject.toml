[project]
name = "arachis-assistant"
version = "0.1.0"
description = "Личный календарь задач, встреч и напоминаний"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.128",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
